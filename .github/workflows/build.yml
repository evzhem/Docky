name: Build APK

on:
  push:
    branches: [ 'arena/**', 'main' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish error report to repository
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "### Kotlin / Gradle errors"
            echo '```'
            grep -nE "^e: |error: |FAILURE:|What went wrong|> Task .*FAILED|Unresolved|Expecting|Cannot|Caused by" build.log | tail -120 || echo "(no matches)"
            echo '```'
            echo
            echo "### Tail of log"
            echo '```'
            tail -n 160 build.log
            echo '```'
          } > build-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.md
          git commit -m "CI: build error report [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
