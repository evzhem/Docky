name: Build APK

on:
  push:
    branches: [ 'arena/**', 'main' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
        continue-on-error: true

      - name: Prepare error report (if failed)
        if: failure()
        run: |
          {
            echo '## ❌ Build failed'
            echo ''
            echo '### Kotlin / Gradle errors'
            echo '```'
            grep -nE "^e: |error: |FAILURE:|What went wrong|> Task .*FAILED|Unresolved|Expecting|Cannot|Caused by" build.log | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "---- report prepared ----"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          name: build-log
          path: build.log
          if-no-files-found: warn
